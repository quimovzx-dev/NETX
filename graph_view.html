<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>NETX Graph</title><style>body{margin:0;background:#070b10;color:#eef3f7;font-family:system-ui}canvas{display:block;width:100vw;height:100vh}#info{position:fixed;top:12px;left:12px;background:#111923dd;padding:12px;border-radius:12px}</style></head><body><div id="info">NETX Knowledge Graph<br><small>Drag nodes • tap for details</small></div><canvas id="c"></canvas><script>const data=window.NETX_GRAPH||{"nodes":[],"edges":[]};const c=document.getElementById('c'),x=c.getContext('2d');function size(){c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio)}size();addEventListener('resize',size);let nodes=data.nodes.map((n,i)=>({...n,x:innerWidth/2+Math.cos(i*2.4)*Math.min(innerWidth*.35,280),y:innerHeight/2+Math.sin(i*2.4)*Math.min(innerHeight*.35,220)}));function draw(){x.clearRect(0,0,innerWidth,innerHeight);x.strokeStyle='#33475a';for(const e of data.edges){let a=nodes.find(n=>n.id===e.from),b=nodes.find(n=>n.id===e.to);if(a&&b){x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}for(const n of nodes){x.beginPath();x.fillStyle=n.type==='entity'?'#6cc5ff':'#9be27a';x.arc(n.x,n.y,n.type==='entity'?7:10,0,Math.PI*2);x.fill();x.fillStyle='#dfe7ee';x.font='12px system-ui';x.fillText(n.label.slice(0,28),n.x+10,n.y+4)}requestAnimationFrame(draw)}draw();c.onclick=e=>{let n=nodes.find(n=>Math.hypot(n.x-e.clientX,n.y-e.clientY)<16);if(n)document.getElementById('info').innerHTML='<b>'+n.label+'</b><br>'+n.type}}</script></body></html>
